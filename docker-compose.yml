version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: catch_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  recovery-service:
    build:
      context: ./recovery-service
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/catch_ai
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./recovery-service:/app
      - ./recovery-engines:/recovery-engines
      - ./evidence:/evidence
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload


volumes:
  postgres_data:
